services:
  - type: web
    name: academic-projects-marketplace
    startCommand: gunicorn config.wsgi:application
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: PAYSTACK_DEMO_MODE
        value: "False"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: USE_CLOUD_STORAGE
        value: "True"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: scholarvault-db
          property: connectionString

databases:
  - name: scholarvault-db
    plan: free
    databaseName: scholarvault
    user: scholarvault